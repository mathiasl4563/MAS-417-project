<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>{% block title %}Pendulum kit{% endblock %}</title>
{% block head %}{% endblock %}
<style>
 body{font-family:system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#222}
 header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid {{ accent }};margin-bottom:1rem}
 header b{color:{{ accent }}}
 nav a{margin-left:1rem}
 label{display:block;margin:.6rem 0 .2rem}
 input,select{padding:.35rem;width:100%;box-sizing:border-box}
 input[type=radio]{width:auto}
 label.inline{display:inline-block;margin-right:1.5rem}
 fieldset{border:1px solid #ccc;border-radius:6px;margin:1rem 0;padding:.5rem 1rem 1rem}
 small{color:#666}
 table{border-collapse:collapse;width:100%;margin:.5rem 0}
 td,th{border-bottom:1px solid #ddd;padding:4px 8px;text-align:left}
 .err{background:#fde2e2;padding:.6rem;border-radius:6px}
 .chip{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
 .produced{color:#1a7f37}.rejected{color:#b42318}.postponed{color:#b54708}.waiting{color:#555}
 button{margin-top:1rem;padding:.6rem 1.2rem}
 form.inline{margin:0} form.inline button{margin:0;padding:.25rem .9rem}
</style></head><body>
<header><b>{{ site }}</b><nav>{% block nav %}{% endblock %}</nav></header>
{% block body %}{% endblock %}
</body></html>
